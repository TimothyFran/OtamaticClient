; OtamaticClient - development configuration
;
; This repository IS the library (see library.json). This file lets you build
; it as a PlatformIO project without altering the library layout: the build
; target is the sketch in examples/WiFiBasic, which depends on the local library
; through "symlink://." (virtual symlink: changes to src/ are picked up
; immediately by subsequent builds, with no copies).
;
; Build:   pio run            (or the Build button of the VS Code extension)
; Clean:   pio run --target clean

[platformio]
default_envs = esp32dev
src_dir = examples/WiFiBasic

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    OtamaticClient=symlink://.
